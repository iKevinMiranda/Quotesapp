<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Citações inspiradoras com um toque de simplicidade.">
    <meta name="theme-color" content="#f5f5f7">
    <title>Citações — Quotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="header">
            <p class="eyebrow">Quotes App</p>
            <h1>Citações inspiradoras</h1>
            <p class="subtitle">Uma frase por vez, com calma.</p>
        </header>

        <main class="main">
            <article class="quote-card" aria-live="polite" aria-busy="true">
                <div class="quote-card__inner">
                    <p id="quote-text" class="quote-text">Carregando…</p>
                    <p id="quote-author" class="quote-author"></p>
                </div>
                <p id="quote-status" class="quote-status" role="status" hidden></p>
            </article>

            <div class="actions">
                <button type="button" id="new-quote" class="btn btn-primary">
                    <span class="btn-label">Nova citação</span>
                </button>
                <button type="button" id="copy-quote" class="btn btn-secondary" disabled>
                    Copiar
                </button>
                <button type="button" id="share-quote" class="btn btn-secondary" disabled hidden>
                    Compartilhar
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="year"></span> Kevin Miranda</p>
        </footer>
    </div>
</body>
</html>
